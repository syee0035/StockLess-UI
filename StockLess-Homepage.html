<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockLess — Prototype</title>
<meta name="description" content="StockLess home screen prototype: landing page, four-step workflow and three languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@400;600&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>





*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-family: var(--font-body);
  font-size: var(--text-body);
  color: var(--ink-2);
  background-color: var(--page);
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  color: var(--ink);
  margin: 0;
}

p { margin: 0; }
button { font-family: var(--font-body); cursor: pointer; }
a { text-decoration: none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ===== Step 1 (upload) layout =====
   Guidance on the left, the drop zone on the right; one column once there is
   no longer room for the drop zone to keep its shape. */
.s1-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(380px, 0.95fr);
  gap: var(--space-10);
  align-items: start;
}
@media (max-width: 980px) {
  .s1-layout { grid-template-columns: 1fr; gap: var(--space-8); }
}

/* ===== interactive purchase-plan example =====
   Evidence on the left, the controls and the verdict on the right. Stacks
   once the control column can no longer hold its stepper rows. */
.ex-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1040px) {
  .ex-grid { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .ex-weeks { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
  .ex-summary { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}

/* ===== sliders =====
   A default range input renders as a hairline on macOS — easy to miss
   entirely. These are drawn to match the mockup: a thick rounded track, a
   teal fill up to the current value, and a thumb big enough to grab. The
   fill comes from --sl-track, set inline from the value. */
.sl-range {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.sl-range::-webkit-slider-runnable-track {
  height: 10px;
  border-radius: 999px;
  background: var(--sl-track, #DCE6E3);
  border: 1px solid var(--line);
}
.sl-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  margin-top: -9px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--teal);
  box-shadow: 0 2px 6px rgba(22, 49, 59, .25);
  cursor: grab;
}
.sl-range:active::-webkit-slider-thumb { cursor: grabbing; }
.sl-range::-moz-range-track {
  height: 10px;
  border-radius: 999px;
  background: #DCE6E3;
  border: 1px solid var(--line);
}
.sl-range::-moz-range-progress { height: 10px; border-radius: 999px; background: var(--teal); }
.sl-range::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--teal);
  box-shadow: 0 2px 6px rgba(22, 49, 59, .25);
  cursor: grab;
}
.sl-range:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }

/* ===== language switcher =====
   The same control the workspace uses, so the prototype and the app read as
   one product. A native select gets the phone's own picker for free. */
.language-switcher {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #edf7ef;
  border: 1px solid #c3e2cc;
  border-radius: 10px;
  padding: 6px 8px;
  color: #2f6c49;
  flex-shrink: 0;
  line-height: 1.3;
}
.language-switcher select {
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  color: inherit;
  background: transparent;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  max-width: 120px;
  min-height: 28px;
}
.language-switcher:focus-within { outline: 2px solid var(--teal); outline-offset: 3px; }
@media (max-width: 600px) {
  .language-switcher { padding: 4px; }
  .language-switcher svg { width: 23px; }
  .language-switcher select { max-width: 102px; }
}

/* ===== top bar =====
   Four controls in one row need about 590px; a phone gives 342px, so below
   760px the row wraps instead of running off the edge. */
.sl-topnav {
  height: 56px;
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
@media (max-width: 760px) {
  .sl-topnav {
    height: auto;
    min-height: 56px;
    padding-top: 10px !important;
    padding-bottom: 10px !important;
    flex-wrap: wrap;
    row-gap: 10px;
    justify-content: flex-end;
  }
  /* the preview toggle is a demo control — it drops to its own line first */
  .sl-topnav > div:nth-of-type(1) { order: 3; margin-right: auto; }
}

/* ===== thumb ergonomics on a phone =====
   The prototype's controls are styled inline (Figma Make output), and an
   inline style outranks a stylesheet, so the phone breakpoint has to say
   !important to reach them. Everything standalone gets to 44px - Apple's and
   Material's floor. Links sitting inside a sentence, like the source
   citations, are left alone: WCAG 2.5.8 exempts them, and boxing them out
   would break the paragraph they belong to. */
.sl-stepper-btn { width: 34px; height: 34px; }
.sl-stepper-input { width: 62px; height: 34px; }

@media (max-width: 760px) {
  .sl-stepper-btn { width: 44px !important; height: 44px !important; }
  .sl-stepper-input { width: 68px !important; height: 44px !important; }
  .sl-range { min-height: 44px; }
  .language-switcher select { min-height: 44px !important; }

  /* the top bar: brand, language, "How it works" */
  .sl-topnav > a,
  .sl-topnav > button { min-height: 44px !important; display: inline-flex !important;
                        align-items: center !important; }

  /* standalone links and buttons tagged in the markup */
  .sl-tap { min-height: 44px !important; display: inline-flex !important;
            align-items: center !important; }
}


/* ===== learn more =====
   Flashcards, matching the live homepage. Each card shows a question;
   activating it turns it over to the answer.

   Still <details>/<summary>, so the keyboard, the open state and the screen
   reader announcement stay the browser's job. The summary never moves: it
   stays flat, on top and full size, so it is always the click target
   whichever face is showing. Only the answer swings in, and it takes no
   pointer events. Rotating the whole card in 3-D looks tempting and breaks
   both of those — a rotated, backface-hidden summary stops hit-testing, and
   forcing the content to render while closed leaves an invisible face lying
   over the page swallowing clicks. */
.learn__title {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 28px;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--ink);
  margin: 0;
}
.learn__lede {
  margin: var(--space-3) 0 0;
  font-size: var(--text-lead);
  color: var(--muted);
  line-height: 1.65;
  max-width: 60ch;
}
.learn__list { margin-top: var(--space-6); perspective: 1200px; }
.learn--cards .learn__list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
}

/* both faces share one grid cell, so the card is as tall as the taller of
   them and an answer can never be clipped. Chrome puts the content in a UA
   slot, so ::details-content is pinned to the cell too. */
.learn__item {
  display: grid;
  border-radius: 16px;
  background: var(--teal-tint);
}
.learn__item > * { grid-area: 1 / 1; min-width: 0; }
.learn__item::details-content { grid-area: 1 / 1; min-width: 0; }
.learn__item + .learn__item { margin-top: 0; }

.learn__q {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 22px 20px;
  min-height: 116px;
  cursor: pointer;
  list-style: none;
  position: relative;
  z-index: 2;
  border-radius: 16px;
  background: var(--teal-tint);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--text-body);
  color: var(--ink);
  transition: background-color 200ms ease;
}
.learn__q::-webkit-details-marker { display: none; }
.learn__q:hover { background: #DDEDE8; }
.learn__item:focus-within { outline: 2px solid var(--teal); outline-offset: 2px; }

/* Open: the question's contents fade out and its panel goes clear, so the
   answer shows through — the summary is still on top and still clickable. */
.learn__icon, .learn__qtext, .learn__chevron { transition: opacity 180ms ease; }
.learn__item[open] .learn__q { background: transparent; }
.learn__item[open] .learn__q:hover { background: rgba(255,255,255,.06); }
.learn__item[open] .learn__icon,
.learn__item[open] .learn__qtext,
.learn__item[open] .learn__chevron { opacity: 0; }

.learn__icon { font-size: 26px; line-height: 1; flex: none; }
.learn__qtext { flex: 1; min-width: 0; }
/* a folded page corner, to say there is a back to this */
.learn__chevron {
  flex: none;
  align-self: flex-end;
  width: 16px; height: 16px;
  border-radius: 3px 0 16px 0;
  background: linear-gradient(135deg, transparent 48%, var(--mint) 50%);
}

.learn__a {
  margin: 0;
  padding: 22px 20px;
  border-radius: 16px;
  background: var(--ink);
  color: #EAF5F2;
  display: flex;
  align-items: center;
  font-family: var(--font-body);
  font-size: var(--text-secondary);
  line-height: 1.6;
  pointer-events: none;                  /* every click belongs to the summary */
  transform: rotateY(-92deg);
  transform-origin: left center;
  opacity: 0;
  transition: transform 340ms cubic-bezier(.2,.7,.3,1), opacity 200ms ease;
}
.learn__item[open] .learn__a { transform: none; opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .learn__a { transform: none; transition: opacity 150ms ease; }
  .learn__icon, .learn__qtext, .learn__chevron, .learn__q { transition: none; }
}

/* "Still have questions?" is a <details> too, so the extra questions open in
   place — no second page and no JavaScript. */
.learn__all {
  margin-top: var(--space-6);
  border-top: 1px solid var(--line);
  padding-top: var(--space-5);
}
.learn__all-q {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  cursor: pointer;
  list-style: none;
  min-height: 44px;
  font-size: var(--text-body);
}
.learn__all-q::-webkit-details-marker { display: none; }
.learn__all-cta {
  color: var(--teal);
  font-weight: var(--weight-bold);
  font-size: var(--text-secondary);
  white-space: nowrap;
}
.learn__all-q:hover .learn__all-cta,
.learn__all[open] .learn__all-cta { text-decoration: underline; }
.learn__all .learn__list { margin-top: var(--space-4); grid-template-columns: 1fr; }

@media (max-width: 900px) {
  .learn--cards .learn__list { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .learn__title { font-size: 24px; }
  .learn__lede { font-size: var(--text-body); }
  .learn__q { padding: 18px 16px; gap: var(--space-2); min-height: 104px; }
  .learn__a { padding: 18px 16px; }
  .learn__all-q { align-items: flex-start; flex-direction: column; gap: 6px; }
}

/* ─── StockLess design tokens ───────────────────────────────────────────────
   Edit this file to restyle the entire app.
   Every colour, font, size, and shadow used in components is a CSS variable.
   ─────────────────────────────────────────────────────────────────────────── */

:root {
  /* ── Ink / text ── */
  --ink:            #16313B;
  --ink-2:          #243238;
  --muted:          #66767D;
  --muted-2:        #86949A;

  /* ── Structural ── */
  --line:           #D7E0DD;
  --line-soft:      #E8EEEC;
  --border-strong:  #B8C8C4;

  /* ── Teal (primary) ── */
  --teal:           #167D74;
  --teal-deep:      #11655E;
  --teal-tint:      #E8F3F0;
  --mint:           #8FD2C8;

  /* ── Red / danger ── */
  --red:            #9B3939;
  --red-tint:       #FBE8E8;

  /* ── Amber / warn ── */
  --amber:          #8B5C10;
  --amber-tint:     #FFF4DF;
  --amber-strong:   #D99120;
  --amber-accent:   #cd8c24;

  /* ── Page / canvas ── */
  --page:           #FFFFFF;
  --card:           #FFFFFF;

  /* ── Shadows ── */
  --shadow-card:    0 10px 30px rgba(22, 49, 59, .05);

  /* ── Typography: families ── */
  --font-display:   'Manrope', system-ui, sans-serif;
  --font-body:      'Source Sans 3', system-ui, sans-serif;
  --font-data:      'Inter', system-ui, sans-serif;
  --font-hand:      'Caveat', cursive;

  /* ── Typography: weights ── */
  --weight-display: 800;
  --weight-heading: 700;
  --weight-body:    400;
  --weight-bold:    700;

  /* ── Typography: sizes — I3-TYPO-01 (Iteration 3 V2) ──
     Supersedes every earlier font-size requirement. Same values as the live
     app's styles.css, so the prototype and the product read as one thing.
     I3-UI AC1 forbids a smaller local override of any role, and no interface
     text goes below label. hero and step-num are display type above
     page-title, not roles. */
  --text-hero:          46px;
  --text-page-title:    40px;
  --text-lead:          20px;
  --text-section-head:  22px;
  --text-body:          16px;
  --text-secondary:     15px;
  --text-description:   14px;
  --text-eyebrow:       13px;
  --text-label:         12px;
  --text-hand:          22px;
  --text-step-num:      56px;

  /* ── Spacing ── */
  --space-1:    4px;
  --space-2:    8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-8:   26px;
  --space-10:  30px;
  --space-12:  36px;
  --space-16:  46px;
  --space-20:  56px;
  --space-24:  66px;

  /* ── Layout ── */
  --page-max-width: min(1420px, 92vw);
  --content-width:   760px;
  --radius-sm:    6px;
  --radius:      10px;
  --radius-card: 16px;
  --radius-btn:  10px;

  /* ── Motion ── */
  --transition: 160ms ease;
}

/* Decorative background bands — see src/components/Decor.tsx.
   Applied to the hero and to the foot of the page only, never behind the
   sections in between, and always with a pale clearing over the middle so
   headings and body copy stay fully legible. */

.sl-band { position: relative; isolation: isolate; }
.sl-band > * { position: relative; z-index: 2; }

.sl-decor {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background: #FCFCF9;
}
.sl-decor svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* each band stretches to the section it wraps, so the artwork never
   spills onto the section below */
.sl-decor--hero { top: 0; bottom: 0; min-height: 420px; }
.sl-decor--foot { top: 0; bottom: 0; }

/* the clearing, plus a fade into the page colour on the open edge */
.sl-decor--hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(40% 34% at 50% 34%, rgba(252,252,249,.94) 0%, rgba(252,252,249,.72) 52%, rgba(252,252,249,0) 80%),
    linear-gradient(to bottom, rgba(252,252,249,0) 74%, var(--page) 100%);
}
.sl-decor--foot::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(46% 40% at 50% 40%, rgba(252,252,249,.92) 0%, rgba(252,252,249,.7) 54%, rgba(252,252,249,0) 82%),
    linear-gradient(to top, rgba(252,252,249,0) 78%, var(--page) 100%);
}

/* the basket clears both the headline and the interactive card beside it */
.sl-basket {
  position: absolute;
  right: 0;
  bottom: 0;
  width: clamp(140px, 18vw, 264px);
  height: auto;
  z-index: 1;
  display: block;
}

@media (max-width: 1050px) {
  .sl-decor--hero { min-height: 360px; }
}

@media (max-width: 760px) {
  .sl-decor--hero { min-height: 300px; }
  /* narrow screens leave no clear column beside the copy, so the basket is
     dropped rather than allowed to sit under the text */
  .sl-basket { display: none; }
  .sl-decor--hero::after {
    background:
      radial-gradient(86% 46% at 50% 34%, rgba(252,252,249,.97) 0%, rgba(252,252,249,.9) 56%, rgba(252,252,249,.2) 100%),
      linear-gradient(to bottom, rgba(252,252,249,0) 72%, var(--page) 100%);
  }
  .sl-decor--foot::after {
    background:
      radial-gradient(90% 50% at 50% 42%, rgba(252,252,249,.96) 0%, rgba(252,252,249,.88) 58%, rgba(252,252,249,.2) 100%),
      linear-gradient(to top, rgba(252,252,249,0) 76%, var(--page) 100%);
  }
}

/* ===== food-waste statistics row =====
   Four fixed columns squeezed each description into one word per line at
   common widths. Auto-fit with a sensible minimum lets it fall to two
   columns, then one, instead of shredding the text. */
.sl-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-6);
}
.sl-stat { min-width: 0; padding-left: var(--space-5); }
.sl-stat--ruled { border-left: 1px solid var(--line); }

@media (max-width: 900px) {
  .sl-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--space-8); }
  /* the rule only reads as a divider on the columns that have one beside them */
  .sl-stat:nth-child(odd) { border-left: none; padding-left: 0; }
}
@media (max-width: 520px) {
  .sl-stats { grid-template-columns: 1fr; }
  .sl-stat { border-left: none; padding-left: 0; }
}

/* The hero and footer artwork is drawn with preserveAspectRatio="slice", so on a
   phone its paths extend well past the viewport. The SVG clips them visually,
   but they still widen the scrollable area — the page could be dragged ~280px
   sideways. `clip` stops that without making a scroll container. */
html, body { overflow-x: clip; }

</style>
