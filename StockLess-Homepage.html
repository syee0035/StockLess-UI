<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockLess — Prototype</title>
<meta name="description" content="StockLess home screen prototype: landing page, four-step workflow and three languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@400;600&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>





*, *::before, *::after {
  box-sizing: border-box;
}

html {
  font-family: var(--font-body);
  font-size: var(--text-body);
  color: var(--ink-2);
  background-color: var(--page);
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  color: var(--ink);
  margin: 0;
}

p { margin: 0; }
button { font-family: var(--font-body); cursor: pointer; }
a { text-decoration: none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ===== Step 1 (upload) layout =====
   Guidance on the left, the drop zone on the right; one column once there is
   no longer room for the drop zone to keep its shape. */
.s1-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(380px, 0.95fr);
  gap: var(--space-10);
  align-items: start;
}
@media (max-width: 980px) {
  .s1-layout { grid-template-columns: 1fr; gap: var(--space-8); }
}

/* ===== interactive purchase-plan example =====
   Evidence on the left, the controls and the verdict on the right. Stacks
   once the control column can no longer hold its stepper rows. */
.ex-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1040px) {
  .ex-grid { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .ex-weeks { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
  .ex-summary { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}

/* ===== sliders =====
   A default range input renders as a hairline on macOS — easy to miss
   entirely. These are drawn to match the mockup: a thick rounded track, a
   teal fill up to the current value, and a thumb big enough to grab. The
   fill comes from --sl-track, set inline from the value. */
.sl-range {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
.sl-range::-webkit-slider-runnable-track {
  height: 10px;
  border-radius: 999px;
  background: var(--sl-track, #DCE6E3);
  border: 1px solid var(--line);
}
.sl-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  margin-top: -9px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--teal);
  box-shadow: 0 2px 6px rgba(22, 49, 59, .25);
  cursor: grab;
}
.sl-range:active::-webkit-slider-thumb { cursor: grabbing; }
.sl-range::-moz-range-track {
  height: 10px;
  border-radius: 999px;
  background: #DCE6E3;
  border: 1px solid var(--line);
}
.sl-range::-moz-range-progress { height: 10px; border-radius: 999px; background: var(--teal); }
.sl-range::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--teal);
  box-shadow: 0 2px 6px rgba(22, 49, 59, .25);
  cursor: grab;
}
.sl-range:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }

/* ===== language switcher =====
   The same control the workspace uses, so the prototype and the app read as
   one product. A native select gets the phone's own picker for free. */
.language-switcher {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #edf7ef;
  border: 1px solid #c3e2cc;
  border-radius: 10px;
  padding: 6px 8px;
  color: #2f6c49;
  flex-shrink: 0;
  line-height: 1.3;
}
.language-switcher select {
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  color: inherit;
  background: transparent;
  border: 0;
  padding: 4px 0;
  cursor: pointer;
  max-width: 120px;
  min-height: 28px;
}
.language-switcher:focus-within { outline: 2px solid var(--teal); outline-offset: 3px; }
@media (max-width: 600px) {
  .language-switcher { padding: 4px; }
  .language-switcher svg { width: 23px; }
  .language-switcher select { max-width: 102px; }
}

/* ===== top bar =====
   Four controls in one row need about 590px; a phone gives 342px, so below
   760px the row wraps instead of running off the edge. */
.sl-topnav {
  height: 56px;
  display: flex;
  align-items: center;
  gap: var(--space-4);
}
@media (max-width: 760px) {
  .sl-topnav {
    height: auto;
    min-height: 56px;
    padding-top: 10px !important;
    padding-bottom: 10px !important;
    flex-wrap: wrap;
    row-gap: 10px;
    justify-content: flex-end;
  }
  /* the preview toggle is a demo control — it drops to its own line first */
  .sl-topnav > div:nth-of-type(1) { order: 3; margin-right: auto; }
}

/* ─── StockLess design tokens ───────────────────────────────────────────────
   Edit this file to restyle the entire app.
   Every colour, font, size, and shadow used in components is a CSS variable.
   ─────────────────────────────────────────────────────────────────────────── */

:root {
  /* ── Ink / text ── */
  --ink:            #16313B;
  --ink-2:          #243238;
  --muted:          #66767D;
  --muted-2:        #86949A;

  /* ── Structural ── */
  --line:           #D7E0DD;
  --line-soft:      #E8EEEC;
  --border-strong:  #B8C8C4;

  /* ── Teal (primary) ── */
  --teal:           #167D74;
  --teal-deep:      #11655E;
  --teal-tint:      #E8F3F0;
  --mint:           #8FD2C8;

  /* ── Red / danger ── */
  --red:            #9B3939;
  --red-tint:       #FBE8E8;

  /* ── Amber / warn ── */
  --amber:          #8B5C10;
  --amber-tint:     #FFF4DF;
  --amber-strong:   #D99120;
  --amber-accent:   #cd8c24;

  /* ── Page / canvas ── */
  --page:           #FFFFFF;
  --card:           #FFFFFF;

  /* ── Shadows ── */
  --shadow-card:    0 10px 30px rgba(22, 49, 59, .05);

  /* ── Typography: families ── */
  --font-display:   'Manrope', system-ui, sans-serif;
  --font-body:      'Source Sans 3', system-ui, sans-serif;
  --font-data:      'Inter', system-ui, sans-serif;
  --font-hand:      'Caveat', cursive;

  /* ── Typography: weights ── */
  --weight-display: 800;
  --weight-heading: 700;
  --weight-body:    400;
  --weight-bold:    700;

  /* ── Typography: sizes ── */
  --text-hero:          52px;
  --text-page-title:    36px;
  --text-lead:          18px;
  --text-section-head:  20px;
  --text-body:          15px;
  --text-secondary:     13px;
  --text-description:   12px;
  --text-label:         10px;
  --text-eyebrow:       11px;
  --text-hand:          22px;
  --text-step-num:      72px;

  /* ── Spacing ── */
  --space-1:    4px;
  --space-2:    8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-8:   32px;
  --space-10:  40px;
  --space-12:  48px;
  --space-16:  64px;
  --space-20:  80px;
  --space-24:  96px;

  /* ── Layout ── */
  --page-max-width: 1080px;
  --content-width:   760px;
  --radius-sm:    6px;
  --radius:      10px;
  --radius-card: 16px;
  --radius-btn:  10px;

  /* ── Motion ── */
  --transition: 160ms ease;
}

/* Decorative background bands — see src/components/Decor.tsx.
   Applied to the hero and to the foot of the page only, never behind the
   sections in between, and always with a pale clearing over the middle so
   headings and body copy stay fully legible. */

.sl-band { position: relative; isolation: isolate; }
.sl-band > * { position: relative; z-index: 2; }

.sl-decor {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background: #FCFCF9;
}
.sl-decor svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* each band stretches to the section it wraps, so the artwork never
   spills onto the section below */
.sl-decor--hero { top: 0; bottom: 0; min-height: 420px; }
.sl-decor--foot { top: 0; bottom: 0; }

/* the clearing, plus a fade into the page colour on the open edge */
.sl-decor--hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(40% 34% at 50% 34%, rgba(252,252,249,.94) 0%, rgba(252,252,249,.72) 52%, rgba(252,252,249,0) 80%),
    linear-gradient(to bottom, rgba(252,252,249,0) 74%, var(--page) 100%);
}
.sl-decor--foot::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(46% 40% at 50% 40%, rgba(252,252,249,.92) 0%, rgba(252,252,249,.7) 54%, rgba(252,252,249,0) 82%),
    linear-gradient(to top, rgba(252,252,249,0) 78%, var(--page) 100%);
}

/* the basket clears both the headline and the interactive card beside it */
.sl-basket {
  position: absolute;
  right: 0;
  bottom: 0;
  width: clamp(140px, 18vw, 264px);
  height: auto;
  z-index: 1;
  display: block;
}

@media (max-width: 1050px) {
  .sl-decor--hero { min-height: 360px; }
}

@media (max-width: 760px) {
  .sl-decor--hero { min-height: 300px; }
  /* narrow screens leave no clear column beside the copy, so the basket is
     dropped rather than allowed to sit under the text */
  .sl-basket { display: none; }
  .sl-decor--hero::after {
    background:
      radial-gradient(86% 46% at 50% 34%, rgba(252,252,249,.97) 0%, rgba(252,252,249,.9) 56%, rgba(252,252,249,.2) 100%),
      linear-gradient(to bottom, rgba(252,252,249,0) 72%, var(--page) 100%);
  }
  .sl-decor--foot::after {
    background:
      radial-gradient(90% 50% at 50% 42%, rgba(252,252,249,.96) 0%, rgba(252,252,249,.88) 58%, rgba(252,252,249,.2) 100%),
      linear-gradient(to top, rgba(252,252,249,0) 76%, var(--page) 100%);
  }
}

/* ===== food-waste statistics row =====
   Four fixed columns squeezed each description into one word per line at
   common widths. Auto-fit with a sensible minimum lets it fall to two
   columns, then one, instead of shredding the text. */
.sl-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-6);
}
.sl-stat { min-width: 0; padding-left: var(--space-5); }
.sl-stat--ruled { border-left: 1px solid var(--line); }

@media (max-width: 900px) {
  .sl-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: var(--space-8); }
  /* the rule only reads as a divider on the columns that have one beside them */
  .sl-stat:nth-child(odd) { border-left: none; padding-left: 0; }
}
@media (max-width: 520px) {
  .sl-stats { grid-template-columns: 1fr; }
  .sl-stat { border-left: none; padding-left: 0; }
}

/* The hero and footer artwork is drawn with preserveAspectRatio="slice", so on a
   phone its paths extend well past the viewport. The SVG clips them visually,
   but they still widen the scrollable area — the page could be dragged ~280px
   sideways. `clip` stops that without making a scroll container. */
html, body { overflow-x: clip; }

</style>

<div id="root"></div>
